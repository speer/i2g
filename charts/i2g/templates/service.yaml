{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "i2g.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "i2g.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "i2g.selectorLabels" . | nindent 4 }}
{{- end }}
