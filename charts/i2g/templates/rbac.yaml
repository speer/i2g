{{- if .Values.rbac.create }}
{{- if not .Values.rbac.namespaced }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "i2g.fullname" . }}
  labels:
    {{- include "i2g.labels" . | nindent 4 }}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["listenersets", "httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "i2g.fullname" . }}
  labels:
    {{- include "i2g.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "i2g.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "i2g.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- /*
Namespaced mode: a Role/RoleBinding in every watched namespace, no
cluster-wide permissions at all. Namespace objects are never read in this
mode since the namespace selector is excluded by the watchNamespaces helper.
*/}}
{{- range $namespace := splitList "," (include "i2g.watchNamespaces" .) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "i2g.fullname" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "i2g.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["listenersets", "httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "i2g.fullname" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "i2g.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "i2g.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "i2g.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- if .Values.controller.leaderElection }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "i2g.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "i2g.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "i2g.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "i2g.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "i2g.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "i2g.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
