apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingress2gateway
  namespace: ingress2gateway-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ingress2gateway
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["listenersets", "httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ingress2gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ingress2gateway
subjects:
  - kind: ServiceAccount
    name: ingress2gateway
    namespace: ingress2gateway-system
---
# Only needed when running with --leader-elect.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingress2gateway-leader-election
  namespace: ingress2gateway-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingress2gateway-leader-election
  namespace: ingress2gateway-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ingress2gateway-leader-election
subjects:
  - kind: ServiceAccount
    name: ingress2gateway
    namespace: ingress2gateway-system
