name: Build and Publish

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Helm lint
        run: |
          helm lint charts/i2g \
            --set controller.gatewayName=gateway

  version_bump:
    runs-on: ubuntu-latest
    needs: [test]
    # Only release on push to main; pull requests just run the test job.
    if: github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup cocogitto
        uses: cocogitto/cocogitto-action@v3
        with:
          check: false
          git-user: github-actions[bot]
          git-user-email: github-actions[bot]@users.noreply.github.com

      - name: Bump version
        id: bump
        run: |
          if cog bump --auto --skip-untracked --dry-run 2>&1 | grep -q "No conventional commits"; then
            echo "No bump required, skipping."
          else
            cog bump --auto --skip-untracked
            VERSION=$(cog get-version 2>/dev/null)
            echo "Bumped to version $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            git push origin --tags
          fi

  build_docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: [version_bump]
    if: needs.version_bump.outputs.version != ''
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ needs.version_bump.outputs.version }}

  build_helm:
    name: Build and publish Helm chart
    runs-on: ubuntu-latest
    needs: [version_bump, build_docker]
    if: needs.version_bump.outputs.version != ''
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Helm login
        run: echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Helm package
        run: helm package charts/i2g --version ${{ needs.version_bump.outputs.version }} --app-version ${{ needs.version_bump.outputs.version }}

      - name: Helm push
        run: helm push i2g-${{ needs.version_bump.outputs.version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
